<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 채널 관리 시트</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap](https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap)" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .table-cell {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
            font-size: 14px;
        }
        .table-header {
            background-color: #f9fafb;
            color: #374151;
            font-weight: 500;
            text-align: left;
        }
        .editable-cell {
            cursor: text;
            min-width: 150px;
        }
        .editable-cell:focus {
            outline: 2px solid #3b82f6;
            background-color: #eff6ff;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-7xl">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">YouTube 채널 관리 도구</h1>
            <p class="mt-2 text-gray-600">유튜브 '추가 정보'를 복사하여 아래 칸에 붙여넣으면 자동으로 표가 생성됩니다.</p>
        </header>

        <main>
            <!-- 입력 섹션 -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <label for="channel-data" class="block text-sm font-medium text-gray-700 mb-2">채널 정보 붙여넣기:</label>
                <textarea id="channel-data" rows="8" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="예: bgmpraiseandworship@gmail.com..."></textarea>
                <div class="mt-4 flex flex-col sm:flex-row gap-4">
                    <button onclick="parseAndAddChannel()" class="w-full sm:w-auto bg-blue-600 text-white font-bold py-2 px-6 rounded-md hover:bg-blue-700 transition duration-300">
                        채널 추가하기
                    </button>
                    <button id="export-csv" onclick="exportToCSV()" class="w-full sm:w-auto bg-green-600 text-white font-bold py-2 px-6 rounded-md hover:bg-green-700 transition duration-300 hidden">
                        CSV로 내보내기
                    </button>
                </div>
            </div>

            <!-- 채널 목록 테이블 -->
            <div class="bg-white rounded-lg shadow-md overflow-x-auto">
                <table class="min-w-full">
                    <thead class="table-header">
                        <tr>
                            <th class="table-cell">이메일</th>
                            <th class="table-cell">채널 URL</th>
                            <th class="table-cell">국가</th>
                            <th class="table-cell">가입일</th>
                            <th class="table-cell">구독자</th>
                            <th class="table-cell">동영상 수</th>
                            <th class="table-cell">총 조회수</th>
                            <th class="table-cell">협조 이메일 발송</th>
                            <th class="table-cell">채널 내용</th>
                            <th class="table-cell">기타</th>
                        </tr>
                    </thead>
                    <tbody id="channel-table-body">
                        <!-- 채널 데이터가 여기에 추가됩니다 -->
                    </tbody>
                </table>
                <p id="empty-table-message" class="p-8 text-center text-gray-500">아직 추가된 채널이 없습니다. 위 칸에 정보를 붙여넣고 '채널 추가하기' 버튼을 눌러주세요.</p>
            </div>
        </main>
    </div>

    <script>
        // 페이지 로드 시 예시 데이터 추가
        window.onload = function() {
            const initialData = `bgmpraiseandworship@gmail.com
                                [www.youtube.com/@SoraTori](https://www.youtube.com/@SoraTori)
                                일본
                                가입일: 2019. 2. 7.
                                구독자 9.02만명
                                동영상 1,852개
                                조회수 24,838,111회`;
            document.getElementById('channel-data').value = initialData;
            parseAndAddChannel();
        };
        
        function parseAndAddChannel() {
            const text = document.getElementById('channel-data').value.trim();
            if (!text) {
                alert('붙여넣을 데이터가 없습니다.');
                return;
            }

            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            
            const data = {
                email: '',
                url: '',
                country: '정보 없음',
                joinDate: '',
                subscribers: '',
                videos: '',
                views: ''
            };

            const unassigned = [];

            lines.forEach(line => {
                if (line.includes('@') && !data.email) {
                    data.email = line;
                } else if (line.includes('[youtube.com/](https://youtube.com/)')) {
                    data.url = line;
                } else if (line.startsWith('가입일:')) {
                    data.joinDate = line.replace('가입일:', '').trim();
                } else if (line.startsWith('구독자')) {
                    data.subscribers = line.replace('구독자', '').trim();
                } else if (line.startsWith('동영상')) {
                    data.videos = line.replace('동영상', '').trim();
                } else if (line.startsWith('조회수')) {
                    data.views = line.replace('조회수', '').trim();
                } else {
                    unassigned.push(line);
                }
            });

            // 키워드가 없는 '국가' 정보 처리
            if (unassigned.length > 0) {
                data.country = unassigned[0];
            }
            
            addChannelToTable(data);
            document.getElementById('channel-data').value = '';
        }

        function addChannelToTable(data) {
            const tableBody = document.getElementById('channel-table-body');
            const newRow = tableBody.insertRow(0); // 맨 위에 추가
            newRow.className = 'fade-in';

            newRow.innerHTML = `
                <td class="table-cell">${createLink(data.email, `mailto:${data.email}`)}</td>
                <td class="table-cell">${createLink(data.url, `https://${data.url}`)}</td>
                <td class="table-cell">${data.country}</td>
                <td class="table-cell">${data.joinDate}</td>
                <td class="table-cell">${data.subscribers}</td>
                <td class="table-cell">${data.videos}</td>
                <td class="table-cell">${data.views}</td>
                <td class="table-cell text-center"><input type="checkbox" class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500"></td>
                <td class="table-cell editable-cell" contenteditable="true"></td>
                <td class="table-cell editable-cell" contenteditable="true"></td>
            `;

            document.getElementById('empty-table-message').style.display = 'none';
            document.getElementById('export-csv').classList.remove('hidden');
        }
        
        function createLink(text, url) {
            if (!text) return '';
            return `<a href="${url}" target="_blank" class="text-blue-600 hover:underline hover:text-blue-800 break-all">${text}</a>`;
        }

        function exportToCSV() {
            const headers = ["이메일", "채널 URL", "국가", "가입일", "구독자", "동영상 수", "총 조회수", "협조 이메일 발송", "채널 내용", "기타"];
            const table = document.querySelector("table");
            let csv = [];
            csv.push(headers.join(','));

            for (let i = 1; i < table.rows.length; i++) {
                const row = [];
                const cols = table.rows[i].cells;
                
                row.push(`"${cols[0].innerText}"`);
                row.push(`"${cols[1].innerText}"`);
                row.push(`"${cols[2].innerText}"`);
                row.push(`"${cols[3].innerText}"`);
                row.push(`"${cols[4].innerText}"`);
                row.push(`"${cols[5].innerText}"`);
                row.push(`"${cols[6].innerText}"`);
                row.push(cols[7].querySelector('input[type="checkbox"]').checked ? '"발송 완료"' : '"미발송"');
                row.push(`"${cols[8].innerText.replace(/"/g, '""')}"`);
                row.push(`"${cols[9].innerText.replace(/"/g, '""')}"`);
                
                csv.push(row.join(','));
            }

            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csv.join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "youtube_channels.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
